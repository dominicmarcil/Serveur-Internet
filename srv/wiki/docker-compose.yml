services:
  otterwiki:
    image: ${WIKI_IMAGE}
    restart: unless-stopped
    volumes:
      - ./app-data:/app-data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wiki.rule=Host(`${WIKI_HOST}`)"
      - "traefik.http.routers.wiki.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.routers.wiki.tls=${TRAEFIK_TLS}"
      - "traefik.http.services.wiki.loadbalancer.server.port=${WIKI_PORT}"
networks:
  proxy:
    external: true
    